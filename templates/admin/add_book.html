{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4>Add New Book</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label>Title</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Author</label>
                        <input type="text" name="author" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="isbn" class="form-label">ISBN *</label>
                        <input type="text" name="isbn" class="form-control" 
                               value="{{ book.isbn if book else '' }}" 
                               pattern="[0-9]{5}" 
                               title="Must be exactly 5 digits (e.g., 12345)" 
                               required maxlength="5" minlength="5">
                        <small class="form-text text-muted">Must be exactly 5 digits (e.g., 12345)</small>
                    </div>
                    <div class="mb-3">
                        <label>Category</label>
                        <input type="text" name="category" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Total Copies</label>
                        <input type="number" name="total_copies" class="form-control" value="1" min="1">
                    </div>
                    <button type="submit" class="btn btn-success">Add Book</button>
                    <a href="{{ url_for('admin.admin_books') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
